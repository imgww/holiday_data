<h1>暑期银联、网联处理支付交易增长明显</h1>
<p>来源：人民网（新华社） ｜ 发布日期：2025-09-07 ｜ 原文URL：<a href="http://finance.people.com.cn/n1/2025/0907/c1004-40558659.html">http://finance.people.com.cn/n1/2025/0907/c1004-40558659.html</a></p>
<hr>
<pre style="white-space:pre-wrap;font-family:inherit">记者9月7日从中国人民银行获悉，今年7月至8月，银联、网联共处理支付交易2769.96亿笔，金额151.66万亿元，同比分别增长14.59%和16.64%。</pre>
