<h1>图表：2025年全国A级景区接待游客75.1亿人次</h1>
<p>来源：中国政府网（新华社） ｜ 发布日期：2026-06-02 ｜ 原文URL：<a href="https://www.gov.cn/zhengce/jiedu/tujie/202606/content_7070934.htm">https://www.gov.cn/zhengce/jiedu/tujie/202606/content_7070934.htm</a></p>
<hr>
<pre style="white-space:pre-wrap;font-family:inherit">文化和旅游部6月2日发布2025年文化和旅游发展统计公报。公报显示，2025年末，全国共有A级景区16994个，直接从业人员173.9万人。全年接待游客75.1亿人次，实现旅游收入5549.9亿元。</pre>
