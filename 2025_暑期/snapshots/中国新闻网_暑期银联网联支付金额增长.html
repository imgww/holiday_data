<h1>2025年暑期银联、网联支付金额同比增长16.64%</h1>
<p>来源：中国新闻网（央视新闻客户端） ｜ 发布日期：2025-09-07 ｜ 原文URL：<a href="http://m.chinanews.com/wap/detail/zw/cj/2025/09-07/10478201.shtml">http://m.chinanews.com/wap/detail/zw/cj/2025/09-07/10478201.shtml</a></p>
<hr>
<pre style="white-space:pre-wrap;font-family:inherit">中国人民银行数据显示，2025年7至8月，银联、网联共处理支付交易2769.96亿笔，金额151.66万亿元，同比分别增长14.59%和16.64%，金额增速较上半年加快3.3个百分点。</pre>
