<h1>端午假期海南接待游客逾158万人次</h1>
<p>来源: <a href="http://hq.news.cn/20230626/8335664affd941e695070df34719a4a2/c.html">http://hq.news.cn/20230626/8335664affd941e695070df34719a4a2/c.html</a></p>
<p>发布时间: 2023-06-25</p>
<hr>
<pre>
2023年端午假期，海南全省接待游客158.82万人次，同比增长19.4%；旅游总收入16.75亿元，同比增长34.6%。其中，旅游景区接待游客95.24万人次，同比增长56.1%；A级以上旅游景区接待游客59.07万人次，同比增长49%；椰级乡村旅游点接待游客28.1万人次，同比增长76.6%。
</pre>
