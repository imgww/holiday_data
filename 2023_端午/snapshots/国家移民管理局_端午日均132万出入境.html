<h1>端午节期间日均132.1万人次出入境</h1>
<p>来源: <a href="https://www.nia.gov.cn/n794014/n1050181/n1050489/c1585961/content.html">https://www.nia.gov.cn/n794014/n1050181/n1050489/c1585961/content.html</a></p>
<p>发布时间: 2023-06-25</p>
<hr>
<pre>
2023年端午节期间全国边检机关共查验出入境人员396.3万人次，日均132.1万人次，较去年端午节增长约2.3倍，是2019年端午节的64.6%。其中，入境204.8万人次，出境191.5万人次；内地居民出入境196.7万人次，港澳台居民167.3万人次，外国人32.3万人次。查验出入境交通运输工具17.6万架（艘、列、辆）次，较去年端午节增长1.6倍。
</pre>
