<h1>端午假期铁路预计发送旅客7100万人次</h1>
<p>来源: <a href="http://paper.people.com.cn/rmrbhwb/html/2023-06/22/content_25999644.htm">http://paper.people.com.cn/rmrbhwb/html/2023-06/22/content_25999644.htm</a></p>
<p>发布时间: 2023-06-21</p>
<hr>
<pre>
记者从中国国家铁路集团有限公司获悉，为期5天的铁路端午假期运输21日启动，自6月21日至6月25日，全国铁路预计发送旅客7100万人次，日均发送旅客1420万人次，6月22日为客流最高峰日，预计发送旅客约1600万人次。
</pre>
