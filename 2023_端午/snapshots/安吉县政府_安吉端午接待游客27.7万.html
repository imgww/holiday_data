<h1>端午假期，我县接待游客27.7万人次</h1>
<p>来源: <a href="http://www.anji.gov.cn/art/2023/6/26/art_1229211475_58918830.html">http://www.anji.gov.cn/art/2023/6/26/art_1229211475_58918830.html</a></p>
<p>发布时间: 2023-06-26</p>
<hr>
<pre>
三天假期安吉全县共接待游客27.7万人次，同比增长47.3%；实现旅游总收入4.16亿元，同比增长84.2%。15家旅游饭店3天平均入住率达70%左右，全县住宿单位3天共接待7.3万余人次。云上草原景区接待游客1.08万人次；中南百草原景区1.9万人次；浙江自然博物院安吉馆2.86万人次。网红打卡点深蓝计划假期前两天累计接待游客约8000人次，实现收入约46万元。
</pre>
