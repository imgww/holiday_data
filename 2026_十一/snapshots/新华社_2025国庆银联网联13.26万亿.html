<body><h1>国庆中秋假期银联、网联共处理支付交易13.26万亿元</h1><p><em>来源URL: http://www.news.cn/20251009/0839b800206447c585aa4ef5cce0a2e5/c.html</em></p><p>记者10月9日从中国人民银行获悉，今年国庆中秋假期（10月1日至8日），银联、网联共处理支付交易415.52亿笔，较去年国庆假期（10月1日至7日）增加95.23亿笔；处理支付交易金额13.26万亿元，较去年国庆假期增加1.86万亿元。</p></body></html>
