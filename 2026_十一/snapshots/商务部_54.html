<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>国庆七天零售餐饮卖了1.87万亿：同比增9.3%，服务消费占比首破六成</title></head><body><h1>国庆七天零售餐饮卖了1.87万亿：同比增9.3%，服务消费占比首破六成</h1><p>来源URL：<a href="https://www.sohu.com/a/1084435572_122942852">https://www.sohu.com/a/1084435572_122942852</a></p><p>采集日期：2026-10-08</p><div>商务部最新监测数据：2026年国庆七天假期，全国重点零售与餐饮企业销售额达到1.87万亿元，同比增长9.3%，创下近五年同期新高；其中服务类消费占比首次突破61.5%，文化、旅游、体育、健康类支出增速均超过两位数。日均超2600亿元。另有报道称国庆期间非遗体验类项目订单量同比增长143%、平均停留时长比常规景点高出2.4小时。</div></body></html>
