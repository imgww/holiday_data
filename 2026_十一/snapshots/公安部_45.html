<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>国庆假期全国社会大局稳定 移民管理部门确保1421万人次顺利通关</title></head><body><h1>国庆假期全国社会大局稳定 移民管理部门确保1421万人次顺利通关</h1><p>来源URL：<a href="https://m.mps.gov.cn/n6935718/n6936554/c10630040/content.html">https://m.mps.gov.cn/n6935718/n6936554/c10630040/content.html</a></p><p>采集日期：2026-10-08</p><div>公安部：截至10月7日16时全国社会大局稳定，刑事、治安警情同比分别下降23.7%、7%，2700余场大型活动安全顺利。移民管理部门强化口岸边境服务管理，确保了1421万人次顺利通关。日均投入社会面巡控警力42万人次、交通交管警力18万人次。</div></body></html>
