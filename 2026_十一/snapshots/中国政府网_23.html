<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>假期客流集中返程 多措并举保有序出行(10月6日超3亿人次)</title></head><body><h1>假期客流集中返程 多措并举保有序出行(10月6日超3亿人次)</h1><p>来源URL：<a href="https://big5.www.gov.cn/gate/big5/www.gov.cn/yaowen/liebiao/202610/content_7082663.htm">https://big5.www.gov.cn/gate/big5/www.gov.cn/yaowen/liebiao/202610/content_7082663.htm</a></p><p>采集日期：2026-10-06</p><div>交通运输部：10月6日全社会跨区域人员流动量超3亿人次；全国铁路预计发送旅客2210万人次、计划加开2199列；全国民航预计运输旅客250万人次；公路迎返程车流高峰，中长途为主，集中时段10时与16时；7日24时前七座及以下小客车免费通行。</div></body></html>
