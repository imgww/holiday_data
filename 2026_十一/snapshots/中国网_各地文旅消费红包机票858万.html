<html><head><meta charset="utf-8"><title>欢度双节 各地文旅打卡清单消费红包已就位-中国网</title></head><body><h1>欢度双节 各地文旅打卡清单消费红包已就位-中国网</h1><p>多家平台出行预测报告显示，截至9月14日，9月25日至10月7日国内航线机票预订量超858万张，同比增长超10%，其中国内2000公里以上航线机票预订量同比增长约14%；出境航线机票预订量超121万张，同比增长约4%。安徽合肥将发放3000万元中秋国庆汽车消费券，最高补6000元；江苏携手电商平台发放3000万元数字消费券，覆盖餐饮、零售、文旅、生活服务；云南发放彩云金秋乐购双节美物消费券。浙江推出100个优质文旅打卡点，举办赛事演出等2300余项重点活动。截至9月22日中秋档预售票房已达2089万元。</p></body></html>
