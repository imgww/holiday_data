<html><head><meta charset="utf-8"><title>全国铁路中秋国庆假期预计发送旅客2.84亿人次-新华网</title></head><body><h1>全国铁路中秋国庆假期预计发送旅客2.84亿人次-新华网</h1><p>新华社北京9月23日电 记者从中国国家铁路集团有限公司获悉，铁路中秋国庆假期运输23日启动，至10月8日结束，为期16天，全国铁路预计发送旅客2.84亿人次，日均计划开行旅客列车约1.3万列，10月1日将迎来铁路客流最高峰。今年中秋国庆双节假期相邻，旅游、探亲、休闲等出行需求旺盛，中秋短途客流与国庆长途客流交织叠加。全国铁路实行高峰运行图，在高峰时段采取增开旅客列车、动车组重联、普速列车加挂车厢等方式投放运力，并开行熊猫专列等特色旅游专列。</p></body></html>
