<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>10月4日全社会跨区域人员流动量同比增长1.3%</title></head><body><h1>10月4日全社会跨区域人员流动量同比增长1.3%</h1><p>来源URL：<a href="https://www.news.cn/politics/20261005/c41261e5aa834b0cac3dc7103346df61/c.html">https://www.news.cn/politics/20261005/c41261e5aa834b0cac3dc7103346df61/c.html</a></p><p>采集日期：2026-10-05</p><div>新华社：10月4日全社会跨区域人员流动量30539万人次，同比增长1.3%。国庆假期前4天(10月1日至4日)，全社会跨区域人员流动量12.44亿人次，与去年同期基本持平。</div></body></html>
