<body><h1>黑龙江发布国庆、中秋促消费活动安排 计划发放政府消费券超1.5亿元</h1><p><em>来源URL: http://hlj.people.com.cn/n2/2026/0916/c220005-41698365.html</em></p><p>9月16日，黑龙江省人民政府新闻办公室举行新闻发布会。双节期间，全省各地将采取"政府主导、平台助力、企业让利"的联动模式，计划发放政府消费券超过1.5亿元，组织开展系列促消费活动300余场。发放方向结合节日消费特点，重点投向汽车、百货、商超、餐饮等领域。年初以来，通过以旧换新政策，带动消费超277亿元，惠及群众超353万人次。</p></body></html>
