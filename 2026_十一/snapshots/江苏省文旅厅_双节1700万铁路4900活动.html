<html><head><meta charset="utf-8"><title>1700万人次、4900项活动 江苏双节文旅供需两旺-央广网</title></head><body><h1>1700万人次、4900项活动 江苏双节文旅供需两旺-央广网</h1><p>长三角铁路中秋国庆假期运输9月23日至10月8日共16天，江苏铁路计划增开临客列车195对，较去年同期增加29对，预计发送旅客1700万人次。江苏省文旅厅联动推出文旅活动超4900项，举办营业性演出1196场，其中5000人以上大型演出44场，预计吸引乐迷超百万；74家博物馆延长开放；175家景区推出门票优惠；江苏自9月22日起在全国率先实现5A级景区对全国持证导游免首道门票；盐城发放1000万元文旅消费券；苏州免费开放全市300余家机关企事业单位内部停车场。</p></body></html>
