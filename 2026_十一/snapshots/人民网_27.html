<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>流动中国 蓬勃向上(前5日跨区域约15.5亿人次)</title></head><body><h1>流动中国 蓬勃向上(前5日跨区域约15.5亿人次)</h1><p>来源URL：<a href="https://cpc.people.com.cn/BIG5/n1/2026/1006/c64387-40809773.html">https://cpc.people.com.cn/BIG5/n1/2026/1006/c64387-40809773.html</a></p><p>采集日期：2026-10-06</p><div>交通运输部数据：国庆假期前5日，全社会跨区域人员流动量约15.5亿人次，平均每天约3亿人次出行。10月1日全国铁路发送旅客2520.4万人次，创单日旅客发送量新高。国家综合立体交通网里程超600万公里，高铁运营里程突破5万公里。</div></body></html>
