<body><h1>中国银联"玩赚大湾区"活动上线云闪付APP</h1><p><em>来源URL: http://www.zgswcn.com/news.html?aid=372054</em></p><p>9月19日，中国银联在云闪付APP正式上线"玩赚大湾区"专区，打造面向粤港澳大湾区用户的一站式消费服务统一入口。专区整合广东、深圳及港澳地区消费权益，覆盖食、行、游、购等民生消费场景，并同步启动中秋国庆主题活动，持续至12月31日。一重礼为消费达标领奖活动，用户在广东地区指定线下商户使用云闪付APP完成消费交易，单笔实付满5元即计为达标1笔；二重礼为交通出行一体化乘车优惠，周末乘车5折；三重礼为三地特色营销。目前大湾区累计覆盖受理商户达数百万户。</p></body></html>
