<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>10月5日全社会跨区域人员流动量预计30620万人次</title></head><body><h1>10月5日全社会跨区域人员流动量预计30620万人次</h1><p>来源URL：<a href="https://www.legaldaily.com.cn/index/content/2026-10/05/content_9468329.html">https://www.legaldaily.com.cn/index/content/2026-10/05/content_9468329.html</a></p><p>采集日期：2026-10-05</p><div>交通运输部：预计10月5日(假期第5日)全社会跨区域人员流动量30620万人次，环比+0.3%，比2025年同期(10月6日)+2.7%；铁路预计2107万(+28.6%)、公路28120万(+1.1%)、水路148万(+14.8%)、民航245万(+1.7%)。返程保障：北京地铁延时运营、广东'三潮汐一管控'、上海虹桥增开12条公交。</div></body></html>
