<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>中国国庆假期过半 小城游爆火 民航热度增35%</title></head><body><h1>中国国庆假期过半 小城游爆火 民航热度增35%</h1><p>来源URL：<a href="https://www.hkcna.hk/cn/content/s6ac46299e4b0a8d1ae418eba.html">https://www.hkcna.hk/cn/content/s6ac46299e4b0a8d1ae418eba.html</a></p><p>采集日期：2026-10-06</p><div>同程旅行：预订两个及以上目的地机票的用户占比超两成，民航出行热度同比增长35%，多城串联游用户平均多停留1.2个城市；节中入园热度较去年同期涨超40%。广之旅：节后国内游整体降幅35%-40%，'机降铁稳'。三亚离岛免税假期前三天销售额近2.4亿元(+13.6%)，购物人数逾3万(+11.2%)。</div></body></html>
