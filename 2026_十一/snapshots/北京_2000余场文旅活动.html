<body><h1>游园赏秋、美食市集，中秋国庆假期北京推出2000余场特色文旅活动</h1><p><em>来源URL: http://m.toutiao.com/group/7686036432956047914/</em></p><p>9月16日，2026年中秋、国庆文旅系列活动发布会举办。中秋、国庆假期，北京市文化和旅游局将以"双节同庆 畅游北京"为主题，推出2000余场特色文旅活动，同时精选文化艺术、游园赏秋、美食市集、国潮非遗、活力竞技等五大类60项品牌活动。飞猪数据显示，截至目前，今年中秋、国庆假期，北京酒店预订量同比增长近70%，旅游度假类商品预订量同比增长约50%。美团数据显示，今年中秋国庆机票预订量同比增长44%。</p></body></html>
