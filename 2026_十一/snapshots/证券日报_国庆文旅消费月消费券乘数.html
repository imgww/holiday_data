<html><head><meta charset="utf-8"><title>2026年全国国庆文化和旅游消费月启动-证券日报</title></head><body><h1>2026年全国国庆文化和旅游消费月启动-证券日报</h1><p>国家信息中心肖宏伟表示，数字消费券的直接消费乘数通常在2倍至3倍区间，若券面设计合理、满减门槛适中，短期拉动倍数可达3.5倍至5.8倍。中国旅游研究院研究员黄璜表示，消费月发放的超3.1亿元消费券等补贴不仅直接带动交通、住宿、餐饮、购物、娱乐等消费，还将体现在就业带动、税收贡献、产业联动等方面。多家平台数据显示，长线游热度领跑，2000公里以上热门航线预订量同比翻倍，10天以上超长行程预订占比达26%。</p></body></html>
