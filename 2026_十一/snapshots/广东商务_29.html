<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>3天44亿 这个国庆广东有多好买</title></head><body><h1>3天44亿 这个国庆广东有多好买</h1><p>来源URL：<a href="https://www.toutiao.com/article/7693170010365166116/">https://www.toutiao.com/article/7693170010365166116/</a></p><p>采集日期：2026-10-05</p><div>商务部监测反馈：10月1日至3日广东全省零售销售额同比增长7.5%、餐饮营业额同比增长6.7%。假期前3天'国补'+'省补'拉动消费近44亿元；消费品以旧换新核销资金2.37亿元(+301.8%)、拉动销售额21.59亿元(+148.8%)。广州白鹅潭万象城10/1客流突破28万人次，佛山万象天地开业首日超20万人次。</div></body></html>
