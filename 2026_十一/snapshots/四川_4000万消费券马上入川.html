<body><h1>四川发放4000万消费券 国庆黄金周"马上入川·蜀你好玩"第三季</h1><p><em>来源URL: https://ent.scol.com.cn/m/wh/202609/83327248.html</em></p><p>记者从2026四川省文化和旅游发展大会新闻发布会获悉，9月28日至10月5日，2026"马上入川·蜀你好玩"第三季文旅消费活动主会场将落地成都。成都市文化广电旅游局局长邱伟透露，本次消费季期间，四川省级将发放3000万消费券，成都市级将发放1000万消费券，覆盖景区门票、酒店住宿、演艺观展等消费领域。消费券将覆盖景区门票、酒店住宿、演艺观展等消费领域。抖音、美团、携程、飞猪等平台将同期推出专属优惠举措。</p></body></html>
