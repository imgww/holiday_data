<html lang="zh-CN"><head><meta charset="utf-8"><title>国家移民管理局关于增加吉尔吉斯斯坦、越南为240小时过境免签和海南30天入境免签政策适用国家的公告</title>
<meta name="source-url" content="https://www.nia.gov.cn/n741440/n741542/c1796294/content.html"></head>
<body><h1>国家移民管理局关于增加吉尔吉斯斯坦、越南为240小时过境免签和海南30天入境免签政策适用国家的公告</h1><p><em>来源URL: https://www.nia.gov.cn/n741440/n741542/c1796294/content.html</em></p><p>自2026年8月20日起，对吉尔吉斯斯坦、越南公民实施240小时过境免签政策和海南30天入境免签政策。240小时过境免签政策适用国家增至57国，海南30天入境免签政策适用国家增至61国。两国公民持普通护照和确定日期及行程的联程客票，可从北京、上海等65个对外开放口岸免签入境，并在规定区域内免签停留不超过240小时。</p></body></html>
