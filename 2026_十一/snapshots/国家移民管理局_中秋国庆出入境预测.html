<html><head><meta charset="utf-8"><title>国家移民管理局部署中秋国庆假期口岸通关保障工作-公安部网站</title></head><body><h1>国家移民管理局部署中秋国庆假期口岸通关保障工作-公安部网站</h1><p>据国家移民管理局预测，今年中秋节假期日均出入境旅客将达225万人次，国庆节假期日均将达215万人次，出入境客流高峰主要集中在9月25日、9月27日、10月1日和10月4日，单日最高通关量预计将突破240万人次。假期期间粤港澳三地将举办彩灯会、烟花汇演、演唱会等多场大型活动，返乡探亲和跨境旅游客流叠加，预计毗邻港澳陆路口岸通关流量将明显增多。</p></body></html>
