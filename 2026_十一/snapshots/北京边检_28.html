<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>国庆假期北京口岸出入境34.4万人次 同比增长11%</title></head><body><h1>国庆假期北京口岸出入境34.4万人次 同比增长11%</h1><p>来源URL：<a href="https://news.qq.com/rain/a/20261006A09Z9600">https://news.qq.com/rain/a/20261006A09Z9600</a></p><p>采集日期：2026-10-06</p><div>北京边检总站：截至10月5日24时，国庆假期北京口岸出入境人员34.4万人次，同比增长11%；其中内地居民24.5万人次(占71.2%)；入出境外国人9万人次(+18.4%)，享受免签政策入境的外国人占入境外国人总量72%。同日上海边检：10/1-5累计查验出入境旅客57.7万人次(+2.4%)、日均11.5万；入境外籍6.7万(+3.3%)，免签及240小时过境免签4.2万(占比六成以上)。</div></body></html>
