<body><h1>中秋国庆佳节将至 浙江丽水推出215场重点文旅活动</h1><p><em>来源URL: http://m.chinanews.com/wap/detail/chs/zw/10696367.shtml</em></p><p>2026年中秋国庆期间，丽水推出"三重好礼、四大地标、五大主题"文旅活动，涵盖215场重点文旅活动，聚焦丰收、非遗、赛事、游戏、星空；发放百万文旅消费券、推出"一张机票游丽水"及"票根当钱花"惠民政策。该市联合抖音、携程等平台推出"百万礼包"，文旅消费券可在平台领券预订酒店民宿、购买景区门票直接抵扣。丽水市商务局表示，"金秋消费季"从9月持续到10月底，重点商圈将推出40多场主题活动。</p></body></html>
