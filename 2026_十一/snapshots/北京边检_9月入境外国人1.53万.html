<body><h1>"像中国人一样生活"圈粉海外游客 入境游持续升温</h1><p><em>来源URL: http://m.toutiao.com/group/7687783125573534244/</em></p><p>记者从北京边检总站了解到，9月以来，北京日均入境外国人达1.53万人次，较8月日均量增长22.4%，其中9月7日单日入境外国人突破1.7万人次，创下今年以来单日最高纪录。截至9月18日，北京口岸享受免签和临时入境许可政策入境的外国人占入境外国人总数的70%。记者从北京市文旅局了解到，今年前八个月，北京市共接待入境游客448.8万人次，同比增长33.5%。北京目前的离境退税商店已经超过了2000家，60多家商户可实现即买即退。</p></body></html>
