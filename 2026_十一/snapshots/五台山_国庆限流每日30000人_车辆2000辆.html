<h1>国庆假期五台山景区限流吗？</h1>
<p>来源：太原本地宝 | 发布时间：2026-09-03 | 采集URL: https://m.ty.bendibao.com/jieri/guoqing/69955.shtm</p>
<p>五台山景区为国家AAAAA级旅游景区。中秋、国庆假日期间严格实行游客和车辆24小时昼夜管控措施，来山游客及车辆需提前一天通过"五台山游客服务中心"微信公众号预约。</p>
<p><strong>每天限定游客30000人、车辆2000辆，达到上限停止预约。</strong>门票预约平台每日共分五个时段，如规定时段入山人数达到上限，系统将自动调配至下一时段；如当天所有时段全部达到上限，将停止预约。</p>
</body></html>
