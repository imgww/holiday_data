<body><h1>银联、网联支付交易笔数同比增长23.45%</h1><p><em>来源URL: http://finance.people.com.cn/n1/2026/0507/c1004-40714679.html</em></p><p>本报北京5月6日电 记者从中国人民银行了解到：今年"五一"假期，银联、网联共处理支付交易289.37亿笔，金额7.85万亿元，较去年"五一"假期分别增长23.45%和2.74%。其中，处理境外来华人员支付交易笔数、金额较去年同期分别增长45.15%和36.96%。</p></body></html>
