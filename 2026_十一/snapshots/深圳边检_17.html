<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>深圳口岸国庆假期日均出入境客流预计97万人次</title></head><body><h1>深圳口岸国庆假期日均出入境客流预计97万人次</h1><p>来源URL：<a href="https://www.toutiao.com/article/7691849737280012840/">https://www.toutiao.com/article/7691849737280012840/</a></p><p>采集日期：2026-10-04</p><div>深圳边检预测国庆假期深圳口岸日均出入境客流97万人次，10月3日陆路口岸双向高峰预计109万人次；广深港高铁跨境客流83.9万(+6.2%)。</div></body></html>
