<link href=""="//rs2.huanqiucdn.cn/huanqiu/image/www/common/favicon1.ico" rel="shortcut icon" /></head><body><img src="//rs2.huanqiucdn.cn/huanqiu/image/m/share.jpg" style="display:none;" id="slogo"><div id="config_page" style="display:none;">/csr-component-m/config/article/index.js</div><div id="global_constant" style="display:none"><span class="global_host">lx.huanqiu.com</span><span class="global_path"></span></div><div class="data-container" style="overflow:hidden; visibility:hidden;height:0;"><article><textarea class="article-aid">9CaKrnKcHOM</textarea><textarea class="article-author"> </textarea><textarea class="article-host">city.huanqiu.com</textarea><textarea class="article-lang">zh-Hans</textarea><textarea class="article-addltype">article</textarea><textarea class="article-title">中秋至国庆全国呈现多个出游高峰 出境游价格上涨</textarea><textarea class="article-subtitle"></textarea><textarea class="article-ext-topic"></textarea><textarea class="article-summary">记者昨日从多家旅游预订机构获悉，目前国庆期间的长线出境游报名已经基本结束，中短线仍有部分余位可以接受预订，十一出境游线路价格比平时有不同幅度的上涨，长线产品涨幅约10%左右，短线产品涨幅在30%左右。</textarea><textarea class="article-catnode">/e3pmh1nv4/e3pn60pg4</textarea><textarea class="article-content"><article><section data-type="rtext"><p>北京青年报记者昨日从多家旅游预订机构获悉，目前国庆期间的长线出境游报名已经基本结束，中短线仍有部分余位可以接受预订，十一出境游线路价格比平时有不同幅度的上涨，长线产品涨幅约10%左右，短线产品涨幅在30%左右。</p><p>中秋至国庆呈现多个出游高峰</p><p>往年十一假期，游客的出游时间大多集中在9月29、30、10月1日，今年的出游却出现了多个高峰，如很多人选择了9月24-26日或10月4-5日出发。旅行社分析，这一出行特点与今年国庆节与中秋节仅隔6天的分布有关，只要请6天年假，不少人便可将中秋节3天假期与国庆黄金周7天假期连起来，拼出16天的“中秋+国庆史上最长假期”。</p><p>拥有“超长假期”后，不仅出发时间变得更加灵活，性价比也更高。比如众信旅游迪拜+埃及线路，9月底的价格约在1.2万元左右，10月1日正日子出发的价格就涨到了1.4万-1.5万元左右。中青旅遨游网出行数据显示，欧洲、中东、非洲、美国、加拿大、澳大利亚、新西兰等长线游目的地今年十一期间的预订异常火热，比如9月22日出发的英国+爱尔兰大全景15日游，两国深度游的同时还能留出1天倒时差休整，16天超长假期一点都不浪费。此外，飞猪平台预订数据显示，受土耳其里拉贬值的影响，今年国庆赴土游客大增，预订数量同比翻了一番。</p><p>长线出境游预订收尾短线尚有余位</p><p>“目前，9月下旬到10月初出发的长线出境游预订已经进入尾声，只有部分短线游产品还有余位。在此提醒各位有出游打算的朋友，由于大部分出境长线目的地签证办理需较长时间，而且好的团期位子比较稀缺，所以一定要趁早预订，提前安排好线路。”中青旅遨游网首席品牌官徐晓磊表示。</p><p>随着游客出游心理的日渐成熟，早预订已经渐渐成为很多人的习惯。驴妈妈旅游网预订数据显示，今年7月初就已开始进入国庆出境长线游产品预订增长期，8月是国内长线游的预订高峰期，进入9月国庆周边游预订开始大幅增长。北京、三亚、厦门、丽江、西安、成都、贵阳、桂林、张家界、大理成为国内长线游十大热门目的地城市。日本、新加坡、越南、中国香港、泰国、美国、印尼、加拿大、马来西亚、澳大利亚则位列出境游人气榜单前十。</p><p>短线出境游价格上涨近三成</p><p>据众信旅游相关负责人介绍，今年国庆黄金周，出境游产品价格较往年同期基本持平。不过，和平日价格相比还是有不同程度的上涨。其中，长线出境游产品涨幅不大，约在10%左右，短线产品价格上浮较为明显，约在30%左右。以土耳其线路为例，平时价格约在1万元上下，十一正日子出发的价格约在1.3万-1.4万左右。</p><p>“十一”出境游价格的波动与机票和酒店价格上涨息息相关。携程大数据显示，多个热门目的地的酒店均价自9月29日起出现上浮，排名前十的目的地中，清迈的酒店价格涨幅最高，单间夜房价同比增长近20%，而新加坡、伦敦、曼谷的单间夜房价同比增长均在10%左右。机票也是一样，国庆期间机票预订量同比大增300%，机票价格较平时整体上浮15%左右。其中，9月30日各地前往成都、杭州、三亚、厦门、南京、西安等地热门出发时段的航班仅剩下经济舱全价票可寻。</p></section></article></textarea><textarea class="article-time">1537148040000</textarea><textarea class="article-copyright"></textarea><textarea class="article-editor-name">责编：陈全</textarea><textarea class="article-source-name"><a href="http://dw.chinanews.com/chinanews/content.jsp?id=8628902" >北京青年报记者</a></textarea><textarea class="article-ext-xtime">1537148040000</textarea><textarea class="article-ext-CommentStatus">1</textarea><textarea class="article-ext-serious">1</textarea><textarea class="article-ext-relation">[]</textarea><textarea class="article-cover">//himg2.huanqiucdn.cn/attachment2010/2018/0917/09/36/20180917093610287.jpg</textarea><textarea class="article-keyboarder">{"email":"chenquan@huanqiu.com","name":"陈全"}</textarea></article><div id="csr_m_article_ad" style="display:none;">43147</div><script>function decodeEntities(encodedString) {
