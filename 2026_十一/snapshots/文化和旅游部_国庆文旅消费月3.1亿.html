<html><head><meta charset="utf-8"><title>2026年全国国庆文化和旅游消费月启动 将发放超3.1亿元消费券-央视网</title></head><body><h1>2026年全国国庆文化和旅游消费月启动 将发放超3.1亿元消费券-央视网</h1><p>9月22日，文化和旅游部在云南省弥勒市举办2026年全国国庆文化和旅游消费月主场活动。消费月从9月下旬持续至10月底，围绕游历山河、中秋团圆、赏秋休闲、红色旅游、研学旅游、夜间经济、非遗美食等需求增加优质文旅产品供给，举办超2万场次文旅活动，发放超3.1亿元消费券等消费补贴。</p></body></html>
