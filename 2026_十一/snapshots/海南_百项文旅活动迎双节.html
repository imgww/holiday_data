<body><h1>游海岛、赏文艺、观赛事！海南推出百项文旅活动迎双节</h1><p><em>来源URL: http://news.cnr.cn/local/dftj/20260920/t20260920_527819744.shtml</em></p><p>据去哪儿平台数据，截至目前，提前预订2026年中秋国庆出行的海南机票订单同比增长两成，提前预订海南酒店量同比翻番。飞猪平台数据显示，假期海南酒店预订量同比增长近70%。9月25日至10月7日，海南将推出旅游促销、文化演艺、体育赛事等重点活动超百项。屯昌推出双节文旅促消费系列活动，县内核心景区免票开放，配套酒店降价、餐饮及购车消费券发放等惠民举措。</p></body></html>
