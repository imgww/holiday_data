<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>2026年中国电影国庆档票房已破10亿元</title></head><body><h1>2026年中国电影国庆档票房已破10亿元</h1><p>来源URL：<a href="https://m.chinanews.com/wap/detail/cht/zw/10708498.shtml">https://m.chinanews.com/wap/detail/cht/zw/10708498.shtml</a></p><p>采集日期：2026-10-06</p><div>猫眼专业版：截至10月6日17时6分，2026年中国电影国庆档(10月1日至7日)累计票房突破10亿元，累计场次325.2万场，观影人次约2749.4万，平均票价36.3元。《神探之痕迹》3.74亿居首、《什么意思夫妇》2.14亿次之、《生化危机：爆发夜》1.16亿第三，前三合计贡献超七成。城市票房前三为上海、北京、深圳；女性观众占比56.4%。</div></body></html>
