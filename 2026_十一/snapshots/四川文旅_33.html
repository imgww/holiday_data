<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>国庆假期第五天 全省A级旅游景区接待游客715.29万人次</title></head><body><h1>国庆假期第五天 全省A级旅游景区接待游客715.29万人次</h1><p>来源URL：<a href="https://new.qq.com/rain/a/20261005A08FYI00">https://new.qq.com/rain/a/20261005A08FYI00</a></p><p>采集日期：2026-10-05</p><div>四川省文旅厅：国庆假期第五天，截至10月5日15时，全省纳入统计的908家A级旅游景区接待游客715.29万人次，实现门票收入7024.19万元；假期五天景区累计接待游客3470.84万人次，同口径同比增长2.59%；5A级景区接待77.95万人次、门票收入3038.60万元。</div></body></html>
