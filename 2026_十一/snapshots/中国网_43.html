<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>国庆假日经济从拼客流到拼体验</title></head><body><h1>国庆假日经济从拼客流到拼体验</h1><p>来源URL：<a href="https://www.china.com.cn/2026-10/07/content_118724545.shtml">https://www.china.com.cn/2026-10/07/content_118724545.shtml</a></p><p>采集日期：2026-10-07</p><div>平台监测：短时目的地小团搜索热度同比+超110%；2026暑期20人以上大团预订-18%、2-6人家庭小团+132%。同程：县域旅游预订热度同比+42%，县域游客平均游玩天数增加3.2天。去哪儿：国庆首日酒店平均入住3.2天，入住4个及以上城市的用户同比+53%；10月1日两成游客已住进第二甚至第三城酒店。四川九寨沟县民宿预订量同比+281%。</div></body></html>
