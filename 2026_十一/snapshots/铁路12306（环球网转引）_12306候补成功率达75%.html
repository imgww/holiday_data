<script src="https://www.huanqiu.com/csr/csr_new_m.js" defer=""></script><link rel="stylesheet" type="text/css" href="//rs1.huanqiucdn.cn/dp/api/assets?dp_csid=cse3pl8tdbi&dp_instanceid=dpe3plc9q0n&dp_commit=308dab855babaf198b9cb78248cbdc4ac85acc93&web_id=1&dp_path=layouts/csr_m_article/csr_m_article.css">
<link rel="apple-touch-icon-precomposed" href="//rs2.huanqiucdn.cn/huanqiu/image/m/share.jpg">
<link href=""="//rs2.huanqiucdn.cn/huanqiu/image/www/common/favicon1.ico" rel="shortcut icon" /></head><body><img src="//rs2.huanqiucdn.cn/huanqiu/image/m/share.jpg" style="display:none;" id="slogo"><div id="config_page" style="display:none;">/csr-component-m/config/article/index.js</div><div id="global_constant" style="display:none"><span class="global_host">lx.huanqiu.com</span><span class="global_path"></span></div><div class="data-container" style="overflow:hidden; visibility:hidden;height:0;"><article><textarea class="article-aid">4EXwKKyPksJ</textarea><textarea class="article-author"> </textarea><textarea class="article-host">china.huanqiu.com</textarea><textarea class="article-lang">zh-Hans</textarea><textarea class="article-addltype">article</textarea><textarea class="article-title">12306候补成功率达75%！如何增加？</textarea><textarea class="article-subtitle"></textarea><textarea class="article-ext-topic"></textarea><textarea class="article-summary">答：针对今年中秋、国庆假期客流高峰，铁路部门将科学调配运力资源，加大运力投放，全国铁路实行高峰运行图，日均旅客座席能力预计较2019年同期增长18.5%</textarea><textarea class="article-catnode">/e3pmh1nnq/e7tl4e309</textarea><textarea class="article-content"><article><section data-type="rtext"><p>据中国国家铁路集团有限公司（以下简称国铁集团）消息，今年铁路中秋国庆黄金周运输自9月27日开始，至10月8日结束，为期12天，全国铁路预计发送旅客1.9亿人次。 </p><p>9月13日，铁路12306开始发售中秋国庆黄金周火车票。 </p><p><em data-scene="strong">抢票怎么会这么难！</em>  </p><p>9月14日，中秋假期临近，不少网友提前加入抢票大军，开始抢购9月28日的火车票。</p><p>抢购过程中，有网友吐槽系统显示余票充足，但是仍需排队购买，“前方排队711人”；还有网友质疑，第三方软件抢票是不是占了普通用户的“坑位”。</p><p>对此，12306客服表示，<em data-scene="strong">余票充足仍需排队是由于同一时间点下订单的用户过多。12306开启售票时间固定，不会针对第三方软件提前售票。</em> </p><p>对于没有买到票的用户，客服表示，今年抢票较往年确实更难些，建议立即加入候补，等待其他用户改签或退票。</p><p>此外，乘客人数较多的情况下，高铁动车也有可能出现由8节车厢改为12节车厢的情况，候补购票可以更快买到票。</p><p><em data-scene="strong">12306候补购票成功率达75%</em>  </p><p>对于中秋、国庆假期，部分热门车次车票是否会出现秒光等问题，国铁集团进行回应。</p><p>1.假期客流高峰，运力是否有保障？</p><p>答：针对今年中秋、国庆假期客流高峰，铁路部门将科学调配运力资源，加大运力投放，全国铁路实行高峰运行图，日均旅客座席能力预计较2019年同期增长18.5%。主要采取以下措施：一<em data-scene="strong">是延长黄金周运输期限，前后达到12天，运输期限超过历年黄金周。二是增开跨铁路局集团公司的直通旅客列车320列，其中动车组214列（含200列夜间高铁），普速旅客列车106列。三是采取动车组重联运行、普速旅客列车加挂车厢等方式，增加热门方向旅客座席</em> ，进京、进沪、进穗方向原则上满轴或满编组运行。四是各铁路局集团公司根据铁路12306售票数据，灵活增开管内旅客列车。</p><p>2.如果出现突发大客流，铁路部门如何应对？</p><p>答：铁路部门在全国主要枢纽节点储备了热备动车组、普速旅客列车车辆以及乘务人员，数量不少于“五一”小长假，一旦出现突发客流，随时可以上线运行，满足旅客出行需求。</p><p>3.预计售票高峰会在哪天出现？铁路12306是否能够应对超大访问量？</p><p>答：为应对今年中秋国庆黄金周售票高峰，技术团队提前做好了各项技术准备工作，加强车票发售监控和例行巡检，组织技术骨干力量集中值班值守，保障售票系统安全稳定运行。</p><p>今年中秋国庆黄金周<em data-scene="strong">售票高峰预计会出现在9月15日</em> ，当日发售9月29日假期第一天的车票。为应对售票高峰期间的超大访问量，12306技术团队采取有针对性的准备措施，在公有云应用、网络带宽扩容、防范恶意抢票等方面重点发力，确保售票系统稳定、高效运行。</p><p>4.中秋、国庆假期，部分热门车次车票是否会出现“秒光”的现象？为什么会出现这种情况？</p><p>答：黄金周期间旅客出行需求“扎堆”，造成局部地区和时段运能紧张，尤其在部分热门方向的线路上，一些始发、终到时间更为适宜，全程旅行时间更短的列车，更是许多旅客的首选出行方案。当这些列车车票起售时，由于其受广大旅客的关注度非常高，旅客朋友会选用12306网络购票、手机App、车站窗口等各种售票渠道快速“抢票”，可能会出现“秒光”现象。</p><p>5.为什么同一列车12306售票系统显示有全程票、长途票，却没有半程票、短途票？</p><p>答：铁路部门会把长途列车的票额，优先满足从始发站乘车到终点站的长途旅客，实现运力资源利用的最大化。当然，也会兼顾短途旅客需求，在长途票额充足时，会根据客流需求变化动态调整票额投放，自动分时段将部分票额转移到沿途各站，满足短途旅客购票出行需求。</p><p>6.铁路12306候补购票功能运行情况如何？如何能增加候补购票成功的机会？</p><p>答：铁路12306候补购票功能运行稳定，<em data-scene="strong">候补兑现成功率达到75%以上。旅客通过提报多个“日期、车次、席别”组合的候补订单，延长候补兑现时间，可增加候补成功率。</em> </p><p>7.铁路12306放票时间如何安排的？</p><p>答：火车票预售期为15天（含当天），但每个车站的起售时间是有差异的，例如北京西站、南京南站为8:00，广州南站为10:00，上海虹桥站为13:30。旅客朋友使用“铁路12306”官方App中的“起售时间”查询功能，可以查询到指定车站的起售时间。</p><p>8.铁路12306试点的在线选铺功能运行情况怎么样？如何保障老人优先分配下铺？</p><p>答：今年6月份，12306开始试行在线选铺服务，目前已经覆盖230趟旅客列车，运行情况良好。在线选铺服务提供了普速列车软卧、硬卧和动车组软卧、一等卧、二等卧等铺别的选择，这些铺别涵盖了不同层次的需求。同时，铁路12306仍然坚持对60岁以上老人等重点旅客优先分配下铺。</p><p>9.客流高峰时旅客买不到直达票该怎么办？</p><p>答：客流高峰期若无法买到直达车票，旅客朋友可采用购买联程票，通过分段乘车的方式满足出行需求，铁路12306将根据旅客出行需求和余票情况，智能推荐有余票的中转换乘方案，供旅客选择。为方便旅客中转换乘，铁路部门目前已在100个主要车站设立了站内中转换乘便捷通道，安排车站工作人员做好引导服务，旅客无需出站即可进入候车室候车，有效缩短了中转换乘时间。</p><p>10.通过第三方网站买票是否存在一定风险？</p><p>答：<em data-scene="strong">铁路12306从未授权任何第三方平台发售火车票。</em> 第三方平台在旅客购票过程中会保留用户信息，不仅有附加费、捆绑销售服务等“陷阱”，还可能存在个人信息泄露风险。请广大旅客一定要通过铁路官方渠道购票，认准12306官方网站和“铁路12306”官方App。</p><p>11.针对车上一些不文明行为，铁路部门如何处理？</p><p>答：铁路是大众化的交通工具，需要广大旅客朋友共同维护文明有序、温馨舒适的出行环境。但是，也有个别旅客存在不文明行为，比如在动车组列车运行中出现吸烟、霸座、大声喧哗等现象，严重影响了其他旅客的乘车体验，有的甚至危及列车安全运行，触犯法律法规。中秋、国庆黄金周假期，我们将通过站车广播视频，加大宣传引导力度，积极倡导文明出行，努力营造良好出行环境。对于一些不文明行为，将及时劝阻。特别严重的，我们将依据相关规定纳入铁路征信系统的失信名单。</p><p>中新经纬综自中国铁路、央视网等</p></section></article></textarea><textarea class="article-time">1694739965256</textarea><textarea class="article-copyright"></textarea><textarea class="article-editor-name">责编：张燕萍</textarea><textarea class="article-source-name"><a href="https://mp.weixin.qq.com/s/wls6e1ATsjH6c4NZfGDw6Q" >中新经纬</a></textarea><textarea class="article-ext-xtime">1694739965256</textarea><textarea class="article-ext-CommentStatus">1</textarea><textarea class="article-ext-serious">1</textarea><textarea class="article-ext-relation">[]</textarea><textarea class="article-cover"></textarea><textarea class="article-keyboarder">{"email":"zhangyanping@huanqiu.com","name":"张燕萍"}</textarea></article><div id="csr_m_article_ad" style="display:none;">43147</div><script>function decodeEntities(encodedString) {
