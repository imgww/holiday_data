<html><head><meta charset="utf-8"><title>中国住宿业消费指数报告（2025年10月）</title></head><body><h1>中国住宿业消费指数报告（2025年10月）</h1><p><a href="http://www.chinahotel.org.cn/articles/17482">原文链接</a></p><pre>2025年10月，中国住宿业消费指数（HCI）为106.3，环比9月增长19.8%，呈现V字形强力复苏状态，指数达到5月以来最高峰。10月平均房价指数为103.3，环比9月增长10.7%。假期全国国内出游8.88亿人次，较2024年同期增加1.23亿人次。四类酒店客房价格均明显回升：经济型、舒适型、高档型、豪华型酒店10月客房价格点数环比9月分别增长10.4%、10.4%、11.6%和10.7%。</pre></body></html>
