<html><head><meta charset="utf-8"><title>国庆中秋假期 全国铁路发送旅客2.13亿人次</title></head><body><h1>国庆中秋假期 全国铁路发送旅客2.13亿人次</h1><p><a href="https://m.gmw.cn/2025-10/11/content_1304181474.htm">原文链接</a></p><pre>9月29日至10月10日，为期12天的铁路国庆中秋假期运输圆满收官，全国铁路累计发送旅客2.13亿人次，日均发送1776.3万人次、同比增长8.6%，国家铁路累计发送货物1.37亿吨。全国铁路日均开行旅客列车12899列、同比增长9.1%，其中10月8日开行旅客列车14196列，创单日客运能力投放历史新高。10月1日发送旅客2313.2万人次，创单日旅客发送量历史新高。</pre></body></html>
