<html><head><meta charset="utf-8"><title>从税收大数据看国庆假期服务消费四大亮点</title></head><body><h1>从税收大数据看国庆假期服务消费四大亮点</h1><p><a href="https://www.chinatax.gov.cn/chinatax/n810219/n810780/c5252828/content.html">原文链接</a></p><pre>税收大数据显示，旅游游览和娱乐服务销售收入同比增长23.6%，其中旅行社服务、游乐园同比分别增长26.2%和41.2%。在旅游消费的带动下，经济型连锁酒店、民宿服务同比分别增长6.3%和12.8%。文化艺术服务销售收入同比增长20.9%，其中文艺创作与表演服务、群众文体活动同比分别增长21%、28.3%。体育服务销售收入同比增长29.4%。</pre></body></html>
