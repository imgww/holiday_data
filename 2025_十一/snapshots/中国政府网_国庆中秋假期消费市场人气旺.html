<html><head><meta charset="utf-8"><title>国庆中秋假期消费市场人气旺亮点多</title></head><body><h1>国庆中秋假期消费市场人气旺亮点多</h1><p><a href="https://www.gov.cn/lianbo/bumen/202510/content_7043533.htm">原文链接</a></p><pre>据商务部商务大数据监测，国庆中秋假期全国重点零售和餐饮企业销售额按可比口径同比增长2.7%。10月1日至7日，商务部重点监测的78个步行街（商圈）客流量、营业额同比分别增长8.8%和6.0%。商务部监测的主要电商平台数据显示，节日期间绿色有机食品销售额同比增长27.9%，智能家居产品同比增长14.3%，国潮服装同比增长14.1%。</pre></body></html>
