<html><head><meta charset="utf-8"><title>帐篷与床车：黄金周酒店业「消失的客人」</title></head><body><h1>帐篷与床车：黄金周酒店业「消失的客人」</h1><p><a href="https://36kr.com/p/3529454070717575">原文链接</a></p><pre>据综合头部OTA平台和行业协会数据，2025年国庆期间全国主要城市（一二线及旅游热点城市）酒店的平均入住率仅为58%，经济型酒店（三星及以下）入住率则跌破了50%。假期8天人均消费911元，平均每人每天花费不到114元，折算日均人均花费同比减少13%。露营装备销量同比激增230%，露营地入住率高达92%。今年涨价最猛的多是经济型酒店，五星酒店反而表现比较平稳：如家房价同比上涨27.1%，汉庭上涨20.6%，维也纳上涨32%。</pre></body></html>
