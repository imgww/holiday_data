<html><head><meta charset="utf-8"><title>景德镇被&quot;鸡排哥&quot;带火，95后扛起旅游大旗：这个黄金周不一样</title></head><body><h1>景德镇被&quot;鸡排哥&quot;带火，95后扛起旅游大旗：这个黄金周不一样</h1><p><a href="https://m.bjnews.com.cn/detail/1759930920129519.html">原文链接</a></p><pre>同程旅行数据显示，假日期间，非一线城市国内跟团游预订热度同比增长超过70%，多以跨区和跨省长线跟团游产品为主；一线城市用户热衷通过定制游提升家庭出游的舒适度和体验感。美团旅行数据显示，国庆假期小团游订单量大幅增长，新疆、内蒙古、四川、云南、西藏、青海、甘肃等均为热门长线小团游目的地。</pre></body></html>
