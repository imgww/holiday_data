<html><head><meta charset="utf-8"><title>2025年9月中国酒店业发展报告（国庆经营数据）</title></head><body><h1>2025年9月中国酒店业发展报告（国庆经营数据）</h1><p><a href="https://tsg.gingkoc.edu.cn/Upload/file/20251031/1761881063156635.pdf">原文链接</a></p><pre>截至10月7日，酒店、民宿国庆假期平均入住率为61.22%，热度高于暑期，不及五一假期，同比去年国庆假期略微下降。其中，酒店国庆平均入住率66.64%，同比去年下降2%，平均房价424.20元/间夜，同比去年上涨0.76%。民宿国庆平均入住率56.71%，同比去年上涨1.27%，平均房价732.72元/间夜，同比去年下降2.17%。数据来源：订单来了，迈点研究院整理。小猪民宿发布《2025年国庆中秋假期旅住报告》：平台累计履约成交总额同比增长55.3%，日均履约间夜同比增长51.3%，平均房价（ADR）持续增长。</pre></body></html>
