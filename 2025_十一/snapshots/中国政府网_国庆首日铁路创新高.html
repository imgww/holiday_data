<html><head><meta charset="utf-8"><title>超2300万人次 国庆中秋假期首日全国铁路旅客发送量创新高</title></head><body><h1>超2300万人次 国庆中秋假期首日全国铁路旅客发送量创新高</h1><p><a href="https://www.gov.cn/yaowen/liebiao/202510/content_7043164.htm">原文链接</a></p><pre>10月1日国庆中秋假期首日，全国铁路发送旅客2313.2万人次，创单日旅客发送量历史新高。今年国庆中秋双节合并放假8天，旅游、探亲、学生客流等出行需求交织叠加，铁路客流呈现总量大、首尾时段高度集中和&quot;首尾长途多、中间中短途多&quot;的特点。</pre></body></html>
