<html><head><meta charset="utf-8"><title>超级假期见证超热文旅消费图景</title></head><body><h1>超级假期见证超热文旅消费图景</h1><p><a href="http://www.news.cn/fortune/20251009/a69857658c244be09fc8a7690ccf535f/c.html">原文链接</a></p><pre>中国旅游研究院测算，假日期间，游客平均出游半径212.66公里，游客目的地平均游憩半径23.04公里，同比分别增长14.8%和24.5%。携程集团数据显示，假期国内长途游订单占比同比提升3个百分点；飞猪平台上，我国游客足迹覆盖超过180个国家和地区，明显高于去年假期。途家平台数据显示，假期外国游客预订民宿覆盖200多个城市，较去年国庆假期增加20个。上海春秋国际旅行社副总经理介绍，探访贵州安顺等&quot;相对小众&quot;目的地、前往新疆阿勒泰拍摄胡杨林等&quot;主题游&quot;以及拉丁美洲长线游受到更多游客关注。</pre></body></html>
