<html><head><meta charset="utf-8"><title>增值税发票数据显示：国庆中秋假期消费市场增势较好</title></head><body><h1>增值税发票数据显示：国庆中秋假期消费市场增势较好</h1><p><a href="https://www.gov.cn/lianbo/bumen/202510/content_7043690.htm">原文链接</a></p><pre>国家税务总局9日发布的最新增值税发票数据显示，国庆中秋假期，全国消费相关行业日均销售收入同比增长4.5%，其中，商品消费和服务消费同比分别增长3.9%和7.6%。数码产品、汽车消费增长较快：手机等通讯器材销售收入同比增长18.8%，汽车销售收入同比增长12.6%，其中新能源汽车同比增长14.7%；黄金价格上升带动珠宝首饰销售收入同比增长41.1%。旅游相关服务销售收入同比增长8.5%，其中休闲观光活动销售收入同比增长17.6%；民宿服务销售收入同比增长9.7%；酒吧、茶馆等休闲服务销售收入同比分别增长28.6%、7.1%。</pre></body></html>
