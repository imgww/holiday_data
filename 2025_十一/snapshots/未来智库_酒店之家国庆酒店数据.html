<html><head><meta charset="utf-8"><title>2025年社会服务行业10月投资前瞻：国庆酒店ADR增速良好拉动RevPAR提升</title></head><body><h1>2025年社会服务行业10月投资前瞻：国庆酒店ADR增速良好拉动RevPAR提升</h1><p><a href="https://www.vzkoo.com/read/202510205d9aabff9352171f509a62ed.html">原文链接</a></p><pre>据酒店之家数据，10.5当周，国内酒店OCC为68.2%，同比-1.6pct；ADR为267.4元/间，同比+8.7%；RevPAR为182.4元/间，同比+6.3%。RevPAR持续回升，主要由ADR增长驱动，国庆当周价格表现良好。国内经济型酒店OCC为69.3%，同比-2.3pct；ADR为203.3元/间，同比+8.0%。</pre></body></html>
