<html><head><meta charset="utf-8"><title>陕西：人文魅力与经济活力相辉映</title></head><body><h1>陕西：人文魅力与经济活力相辉映</h1><p><a href="http://www.shaanxi.gov.cn/xw/sxyw/202510/t20251010_3573657_wap.html">原文链接</a></p><pre>国庆中秋假期，西安文旅市场活力迸发，全市共接待游客2007.75万人次，游客总花费达199.59亿元。大唐不夜城接待游客288.2万人次、实现营收2.18亿元，同比分别增长6.12%、64.66%。21台重点旅游演艺共演出1188场，吸引游客95.2万人次，同比增长7%。西安市旅行社接待国内团队游客42.5万人次，同比增长9.3%；接待入境团队游客8258人次，同比增长55.1%。</pre></body></html>
